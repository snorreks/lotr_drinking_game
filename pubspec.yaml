name: lotr_drinking_game
description: Fellowship of the Drink
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  cloud_firestore: ^7.1.0
  cupertino_icons: ^2.0.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_performance: ^0.12.1
  firebase_remote_config: ^7.0.1
  fl_chart: ^1.3.1
  flash: ^3.0.5+1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.8.1
  json_serializable: ^6.7.0
  logger: ^2.8.0
  rflutter_alert: ^2.0.7
  rxdart: ^0.28.0
  wakelock_plus: ^1.8.2
  easter_egg_trigger: ^2.0.0
  video_player: ^2.7.0
  google_fonts: ^9.0.0

dev_dependencies:
  build_runner: ^2.4.5
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_icons:
  ios: true
  android: true
  web:
    generate: true
    image_path: "assets/images/logo/logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  image_path_android: "assets/images/logo/logo.png"
  image_path_ios: "assets/images/logo/logo-launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/characters/
    - assets/audio/other/
    - assets/audio/characters/